name: Release

# Push a tag like v0.2.0 (matching the workspace version in Cargo.toml) to
# build velmux for macOS, Linux and Windows and publish a GitHub release with the
# archives and their checksums. The Homebrew tap (vincentvella/homebrew-tap)
# picks the new release up by itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # musl: static binaries that run on any distro.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    # Git Bash on Windows, so every step below runs the same.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG but Cargo.toml says $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p velmux-cli
      - name: Package
        run: |
          name="velmux-$TAG-${{ matrix.target }}"
          exe=velmux; [ "$RUNNER_OS" = Windows ] && exe=velmux.exe
          # (Git Bash on Windows has sha256sum, not shasum.)
          sum() { if command -v shasum >/dev/null; then shasum -a 256 "$@"; else sha256sum "$@"; fi; }
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/$exe" README.md LICENSE NOTICE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sum "$name.tar.gz" > "$name.tar.gz.sha256"
          # Also without the version, so .../releases/latest/download/<file>
          # always works (the site's download links and install.sh).
          plain="velmux-${{ matrix.target }}.tar.gz"
          cp "$name.tar.gz" "$plain"
          sum "$plain" > "$plain.sha256"
          "$name/$exe" --version || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: velmux-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "velmux $TAG" --generate-notes --verify-tag
          fi
