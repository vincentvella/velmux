[workspace]
resolver = "2"
members = ["crates/velmux-pool", "crates/velmux-cli", "crates/velmux-tui"]

[workspace.package]
version = "0.16.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/vincentvella/velmux"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
